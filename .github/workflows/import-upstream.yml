name: Import and white-label CloudVault
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-upstream.yml'
      - 'scripts/prepare_cloudvault.py'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CloudVault
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch upstream source
        run: |
          git clone --depth 1 https://github.com/project-epb/flaredrive-rev.git /tmp/flaredrive-upstream
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' /tmp/flaredrive-upstream/ ./
      - name: Apply CloudVault branding
        run: python3 scripts/prepare_cloudvault.py
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import and rebrand CloudVault (MIT upstream)"
            git push origin HEAD:main
          fi
